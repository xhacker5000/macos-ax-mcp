<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>macos-ax-mcp upload test</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1c1e21; --muted:#6b7280; --ok:#0f7b3f; --line:#e3e5e8; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181c; --card:#1f2228; --fg:#e8eaed; --muted:#9aa0a6; --ok:#4ade80; --line:#30343b; --accent:#60a5fa; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px 16px; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system, "PingFang SC", system-ui, sans-serif; }
  main { max-width:720px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:16px; }
  label.pick { display:inline-block; padding:10px 18px; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  input[type=file] { position:absolute; left:-9999px; }
  #status { font-weight:600; margin-top:14px; }
  #status.ok { color:var(--ok); }
  table { width:100%; border-collapse:collapse; margin-top:8px; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
  th { color:var(--muted); font-weight:500; width:150px; }
  code { font:13px ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<main>
  <h1>macOS file dialog upload test</h1>
  <p class="lead">Click the button to open Chrome's native file chooser, then run
    <code>macos-ax-mcp --cli handle-dialog --file &lt;path&gt;</code>. File metadata is read
    from the <code>File</code> object only; contents are never loaded, so multi-GB files are fine.</p>

  <div class="card">
    <label class="pick" for="file">Choose file…</label>
    <input id="file" type="file" multiple>
    <div id="status">No file selected yet.</div>
  </div>

  <div class="card" id="results" hidden></div>
</main>
<script>
  console.info('[e2e] page loaded', location.href);
  console.warn('[e2e] sample warning before any debugger attached');
  const input = document.getElementById('file');
  const status = document.getElementById('status');
  const results = document.getElementById('results');
  const human = n => {
    const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0, v = n;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (i ? v.toFixed(2) : v) + ' ' + u[i];
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  input.addEventListener('change', () => {
    const files = Array.from(input.files);
    if (!files.length) { status.textContent = 'Selection cancelled.'; status.className = ''; results.hidden = true; return; }
    status.textContent = `✓ ${files.length} file(s) selected at ${new Date().toLocaleTimeString()}`;
    status.className = 'ok';
    results.hidden = false;
    results.innerHTML = files.map(f => `
      <table>
        <tr><th>Name</th><td id="name">${esc(f.name)}</td></tr>
        <tr><th>MIME type</th><td id="type">${esc(f.type || '(unknown)')}</td></tr>
        <tr><th>Size (bytes)</th><td id="size">${f.size}</td></tr>
        <tr><th>Size</th><td>${human(f.size)}</td></tr>
        <tr><th>Last modified</th><td>${new Date(f.lastModified).toLocaleString()}</td></tr>
      </table>`).join('');
    document.title = `selected: ${files[0].name} (${files[0].size} bytes)`;
    console.log('[e2e] change event', files[0].name, files[0].size);
  });
</script>
</body>
</html>
